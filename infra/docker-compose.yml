# Dev (in-memory):      docker compose up --build
# Postgres mode:        set DATABASE_URL and JWT_SECRET in ../.env, then  docker compose --profile prod up --build
services:
  api:
    build: ../apps/api
    env_file:
      - path: ../.env
        required: false
    ports: ["8000:8000"]
  postgres:
    profiles: [prod]
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: qai}
    volumes: ["../apps/api/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql"]
